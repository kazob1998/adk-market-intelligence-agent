name: CI/CD Pipeline - ADK Market Intelligence Agent

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    name: Test, Evaluation & Regression Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Full Unit & Integration Test Suite
        env:
          GOOGLE_CLOUD_PROJECT: "ci-test-project"
          SESSION_DB_PATH: ":memory:"
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py"

      - name: Run Formal Golden Dataset Benchmark Suite
        env:
          GOOGLE_CLOUD_PROJECT: "ci-test-project"
          SESSION_DB_PATH: ":memory:"
        run: |
          PYTHONPATH=. python cli.py --eval-golden

      - name: Run Agent CLI Evaluation Run
        env:
          GOOGLE_CLOUD_PROJECT: "ci-test-project"
          SESSION_DB_PATH: ":memory:"
        run: |
          PYTHONPATH=. python cli.py --query "Analyze Alphabet (GOOGL) financial risk and market outlook" --eval

  terraform-lint:
    name: Terraform IaC Lint & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [test-and-eval, terraform-lint]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: adk-market-intelligence-agent:latest
