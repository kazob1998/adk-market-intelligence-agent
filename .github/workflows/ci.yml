name: CI/CD Pipeline - ADK Market Intelligence Agent

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-eval:
    name: Test & Evaluation Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Unit & Integration Tests
        env:
          GOOGLE_CLOUD_PROJECT: "ci-test-project"
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py"

      - name: Run Agent CLI Benchmark Evaluation
        env:
          GOOGLE_CLOUD_PROJECT: "ci-test-project"
        run: |
          PYTHONPATH=. python cli.py --query "Analyze GOOGL risk and market performance" --eval

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test-and-eval

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: adk-market-intelligence-agent:latest
